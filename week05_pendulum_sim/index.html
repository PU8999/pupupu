<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>单摆简谐振动模拟器 · Week05</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #1a1a24;
    color: #e0e0f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
      "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow: hidden;
  }
  canvas {
    display: block;
    background: #1a1a24;
  }
  .panel {
    position: fixed;
    padding: 14px 18px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(139, 233, 253, 0.18);
    border-radius: 10px;
    font-size: 13px;
    line-height: 1.85;
    color: #b8b8c8;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    user-select: none;
  }
  .panel.left  { top: 20px; left: 20px; }
  .panel.right { top: 20px; right: 20px; text-align: right; }
  .panel b     { color: #8be9fd; font-weight: 500; }
  .val         { color: #f8f8ff; font-variant-numeric: tabular-nums;
                 font-feature-settings: 'tnum'; }
  .title {
    font-size: 14px;
    color: #8be9fd;
    letter-spacing: 1px;
    margin-bottom: 6px;
    text-transform: uppercase;
  }
  .footer {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    color: rgba(139, 233, 253, 0.55);
    letter-spacing: 1px;
    user-select: none;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div class="panel left">
  <div class="title">Pendulum · Parameters</div>
  <div><b>摆长 L</b> &nbsp;= <span class="val">200</span> px</div>
  <div><b>重力 g</b> &nbsp;= <span class="val">9.8</span> m/s²</div>
  <div><b>初始角度</b> &nbsp;= <span class="val">45°</span></div>
  <div><b>周期 T</b> &nbsp;= 2π√(L/g) ≈ <span class="val">28.4</span> s</div>
</div>

<div class="panel right">
  <div class="title">Live Telemetry</div>
  <div><b>θ</b> &nbsp;<span class="val" id="angle">0.0</span>°</div>
  <div><b>ω</b> &nbsp;<span class="val" id="omega">0.00</span> rad/s</div>
  <div><b>v</b> &nbsp;<span class="val" id="speed">0.00</span> px/s</div>
  <div><b>t</b> &nbsp;<span class="val" id="time">0.00</span> s</div>
</div>

<div class="footer">SIMPLE PENDULUM · HARMONIC OSCILLATION · rAF DRIVEN</div>

<script>
(() => {
  'use strict';

  const canvas = document.getElementById('canvas');
  const ctx    = canvas.getContext('2d');
  const angleEl  = document.getElementById('angle');
  const omegaEl  = document.getElementById('omega');
  const speedEl  = document.getElementById('speed');
  const timeEl   = document.getElementById('time');

  // ---------- 画布自适应 ----------
  let W = 0, H = 0;
  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- 物理参数 ----------
  const L  = 200;                    // 摆长 (像素)
  const g  = 9.8;                    // 重力加速度
  let theta = 45 * Math.PI / 180;    // 初始角度 45° (弧度)
  let omega = 0;                     // 角速度 (rad/s)
  let t     = 0;                     // 累计物理时间 (s)

  // ---------- 数值积分 ----------
  // Semi-implicit (symplectic) Euler + sub-stepping
  // 每帧推进 1/15 秒物理时间，分 4 个 sub-step 保证稳定性
  const FRAME_DT  = 1 / 15;
  const SUB_STEPS = 4;

  function step() {
    const subDt = FRAME_DT / SUB_STEPS;
    for (let i = 0; i < SUB_STEPS; i++) {
      // θ'' = -(g/L) * sin(θ)   —— 严格非线性方程（不取小角近似）
      const alpha = -(g / L) * Math.sin(theta);
      omega += alpha * subDt;
      theta += omega * subDt;
    }
    t += FRAME_DT;
  }

  // ---------- 渲染 ----------
  function getPivot() {
    // 支点：水平居中，距顶端 1/3 高度处
    return { x: W / 2, y: H / 3 };
  }

  function drawGrid() {
    // 极淡的科技网格
    ctx.strokeStyle = 'rgba(139, 233, 253, 0.05)';
    ctx.lineWidth   = 1;
    const step = 20;
    ctx.beginPath();
    for (let x = 0; x <= W; x += step) {
      ctx.moveTo(x + 0.5, 0);
      ctx.lineTo(x + 0.5, H);
    }
    for (let y = 0; y <= H; y += step) {
      ctx.moveTo(0,       y + 0.5);
      ctx.lineTo(W,       y + 0.5);
    }
    ctx.stroke();
  }

  function drawTrackArc(p) {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.beginPath();
    ctx.arc(0, 0, L, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(139, 233, 253, 0.08)';
    ctx.lineWidth   = 1;
    ctx.setLineDash([3, 6]);
    ctx.stroke();
    ctx.restore();
  }

  function drawString(p, bx, by) {
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(bx,   by);
    ctx.strokeStyle = 'rgba(220, 220, 240, 0.75)';
    ctx.lineWidth   = 1.5;
    ctx.stroke();
  }

  function drawPivot(p) {
    ctx.beginPath();
    ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
    ctx.fillStyle   = '#8be9fd';
    ctx.shadowColor = '#8be9fd';
    ctx.shadowBlur  = 16;
    ctx.fill();
    ctx.shadowBlur  = 0;

    // 中心实心点
    ctx.beginPath();
    ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
  }

  function drawBob(bx, by) {
    const R = 14;

    // 1) 外层弥散光晕
    const halo = ctx.createRadialGradient(bx, by, 0, bx, by, R * 4);
    halo.addColorStop(0.0, 'rgba(255, 200, 120, 0.55)');
    halo.addColorStop(0.3, 'rgba(255, 150,  80, 0.22)');
    halo.addColorStop(0.7, 'rgba(255, 120,  60, 0.06)');
    halo.addColorStop(1.0, 'rgba(255, 120,  60, 0.00)');
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(bx, by, R * 4, 0, Math.PI * 2);
    ctx.fill();

    // 2) 球体本体（径向渐变模拟 3D 球面）
    const ball = ctx.createRadialGradient(
      bx - R * 0.35, by - R * 0.35, R * 0.1,
      bx,            by,            R
    );
    ball.addColorStop(0.0, '#fff6dc');
    ball.addColorStop(0.35, '#ffc178');
    ball.addColorStop(0.75, '#d9701e');
    ball.addColorStop(1.0,  '#7a3008');
    ctx.fillStyle = ball;
    ctx.beginPath();
    ctx.arc(bx, by, R, 0, Math.PI * 2);
    ctx.fill();

    // 3) 镜面高光
    ctx.beginPath();
    ctx.arc(bx - R * 0.35, by - R * 0.35, R * 0.22, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
    ctx.fill();
  }

  function render() {
    // 拖影式清屏，营造运动模糊
    ctx.fillStyle = 'rgba(26, 26, 36, 0.30)';
    ctx.fillRect(0, 0, W, H);

    drawGrid();

    const p = getPivot();
    const bx = p.x + L * Math.sin(theta);
    const by = p.y + L * Math.cos(theta);

    drawTrackArc(p);
    drawString(p, bx, by);
    drawBob(bx, by);
    drawPivot(p);

    // 实时数据
    angleEl.textContent = (theta * 180 / Math.PI).toFixed(1);
    omegaEl.textContent = omega.toFixed(2);
    speedEl.textContent = (omega * L).toFixed(2);
    timeEl.textContent  = t.toFixed(2);
  }

  // ---------- 主循环 ----------
  function loop() {
    step();
    render();
    requestAnimationFrame(loop);
  }

  loop();
})();
</script>
</body>
</html>
